<!DOCTYPE html>

    <style>
    /* Calendar navigation */
    .calendar-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 15px 0;
        font-size: 1.3rem;
    }
    
    .nav-btn {
        background: #007bff;
        color: white;
        padding: 6px 12px;
        border-radius: 6px;
        text-decoration: none;
    }
    
    .nav-btn:hover {
        background: #0056b3;
    }
    
    /* Event dots */
    .event-dots {
        margin-top: 4px;
        display: flex;
        gap: 4px;
        justify-content: center;
    }
    
    .event-dot {
        width: 6px;
        height: 6px;
        background: #ff5722;
        border-radius: 50%;
    }
    
    /* Calendar styling */
    .calendar-wrapper table {
        width: 100%;
        font-size: 1.2rem;
    }
    
    .calendar-wrapper td.day {
        cursor: pointer;
        padding: 10px;
        vertical-align: top;
    }
    
    .calendar-wrapper td.day:hover {
        background: #e0f0ff;
    }

    </style>


  </head>

  <body>
